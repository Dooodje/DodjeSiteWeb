name: Contenu auto (actu + guides)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actu-auto
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Extraire les chiffres officiels et publier une actu si ≥ 3 faits
        env:
          AUTO_COMMIT: '1'
        run: node scripts/publish-actu-daily.mjs
        continue-on-error: true

      - name: Publier un guide investissement sourcé (file d'attente)
        env:
          AUTO_COMMIT: '1'
        run: node scripts/publish-guide-daily.mjs
