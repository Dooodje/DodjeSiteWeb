name: Contenu auto (actu + blog)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actu-auto
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Vérifier les extracteurs de barèmes
        run: node scripts/editorial-extractors.test.mjs

      - name: Publier l'actualité du jour
        id: actu
        env:
          AUTO_COMMIT: '1'
        run: node scripts/publish-actu-daily.mjs
        continue-on-error: true

      - name: Publier l'article de blog du jour
        id: blog
        if: always()
        env:
          AUTO_COMMIT: '1'
        run: node scripts/publish-blog-daily.mjs

      - name: Échouer si une publication a échoué
        if: always() && (steps.actu.outcome == 'failure' || steps.blog.outcome == 'failure')
        run: exit 1
