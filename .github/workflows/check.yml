name: Vérification (branches)

# Construit et valide le site sur toute branche autre que main, sans rien déployer.
on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Images et hubs
        run: |
          node scripts/article-image.mjs --missing
          node scripts/contenu.mjs hubs
      - run: npm run build
      - run: npm run validate:seo
      - name: Contrôle des articles en JSON
        run: |
          for f in content/actualites/*.json content/histoire/*.json; do
            [ -e "$f" ] || continue
            node -e "const j=require('./$f'); j.update=true; require('fs').writeFileSync('/tmp/a.json', JSON.stringify(j))"
            node scripts/contenu.mjs verifier /tmp/a.json
          done
