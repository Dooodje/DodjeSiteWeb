name: Deploy

on:
  push:
    branches:
      - main
  # Les commits du bot (GITHUB_TOKEN) ne déclenchent pas "push" : le contenu auto appelle ce workflow lui-même.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Historique complet : le lastmod du sitemap vient de « git log » pour les pages sans date.
          # Avec un clone superficiel, toutes ces pages prenaient la date du jour à chaque déploiement.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Les articles publiés par les tâches planifiées Claude arrivent sans image : on les crée ici.
      - name: Images des articles et hubs à jour
        run: |
          node scripts/article-image.mjs --missing
          node scripts/contenu.mjs hubs

      - name: Build
        run: npm run build

      - name: Validate SEO artifacts
        run: npm run validate:seo

      # Avant la mise en ligne : liste des URL nouvelles ou modifiées par rapport au sitemap en ligne.
      - name: IndexNow, URL à soumettre
        env:
          SITE_URL: https://dodje.fr
        run: node scripts/indexnow.mjs diff --out indexnow-urls.txt

      - name: Upload IndexNow list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy_github_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Après la mise en ligne seulement : Bing vérifie la clé et explore les URL dès réception.
  # Un refus fait échouer ce job (visible en rouge), sans annuler le déploiement.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy_github_pages
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/indexnow.mjs
            data/indexnow.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download IndexNow list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Soumettre à IndexNow
        env:
          SITE_URL: https://dodje.fr
        run: node scripts/indexnow.mjs submit --in indexnow-urls.txt
