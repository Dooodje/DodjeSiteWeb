name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  detect_deploy_target:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      target: ${{ steps.set.outputs.target }}
    steps:
      - id: set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "target=cloudflare" >> "$GITHUB_OUTPUT"
          else
            echo "target=github-pages" >> "$GITHUB_OUTPUT"
          fi

  deploy_cloudflare_pages:
    runs-on: ubuntu-latest
    needs: [build, detect_deploy_target]
    if: needs.detect_deploy_target.outputs.target == 'cloudflare'
    name: Deploy to Cloudflare Pages

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dodje-landing --branch=main

  deploy_github_pages:
    runs-on: ubuntu-latest
    needs: [build, detect_deploy_target]
    if: needs.detect_deploy_target.outputs.target == 'github-pages'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
